server:

 # Run as root (don't try to drop privileges)
 username: ""
 
 # Log to stderr (avoid /dev/null issues in minimal containers)
 logfile: ""
 use-syslog: no
 
 # Disable chroot for container environment
 chroot: ""
 
 # Directory for runtime data
 directory: "/var/lib/unbound"
 
 # PID File
 pidfile: "/var/run/unbound.pid"

 # The verbosity number, level 0 means no verbosity, only errors.
 verbosity: 0
 module-config: "validator cachedb iterator"

 interface: 127.0.0.1
 # DNS port
 port: 5335
 do-ip4: yes
 do-udp: yes
 do-tcp: yes

 # May be set to yes if you have IPv6 connectivity
 do-ip6: no
 prefer-ip6: no

 # Root hints and trust anchor
 root-hints: "/var/lib/unbound/root.hints"
 auto-trust-anchor-file: "/var/lib/unbound/root.key"

 # Security hardening
 harden-glue: yes
 harden-large-queries: yes
 harden-dnssec-stripped: yes
 edns-buffer-size: 1232
 rrset-roundrobin: yes
 
 # Cache settings
 cache-min-ttl: 300
 cache-max-ttl: 86400
 serve-expired: yes
 
 # Privacy settings
 qname-minimisation: yes
 hide-identity: yes
 hide-version: yes
 identity: "Server"
 
 # Performance
 num-threads: 1
 msg-cache-size: 50m
 rrset-cache-size: 100m
 so-reuseport: yes
 so-rcvbuf: 360448
 so-sndbuf: 360448

 # Private IP ranges
 private-address: 192.168.0.0/16
 private-address: 169.254.0.0/16
 private-address: 172.16.0.0/12
 private-address: 10.0.0.0/8
 private-address: fd00::/8
 private-address: fe80::/10

 # TLS certificates for opportunistic use
 tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
 name: "."
 forward-tls-upstream: no
 # Stubby (DNS-over-TLS proxy)
 forward-addr: 127.0.0.1@8053
 # Cloudflared (DNS-over-HTTPS proxy)
 forward-addr: 127.0.0.1@5053

cachedb:
 backend: "redis"
 # Use Unix socket for better performance
 redis-server-path: "/var/run/redis/redis.sock"
 redis-timeout: 100