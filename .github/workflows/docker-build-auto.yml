name: Continuous Build (Auto-Tag)

on:
  push:
    branches:
      - 'latest'
      - 'hardened'
      - 'latest-wolfi'
      - 'hardened-wolfi'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Auto-Tag
        uses: docker/build-push-action@v5
        with:
          context: .
          # Logic: If branch name contains 'wolfi', build 2 archs, else build 4 archs
          platforms: ${{ contains(github.ref_name, 'wolfi') && 'linux/amd64,linux/arm64' || 'linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6' }}
          push: true
          no-cache: true
          tags: andrianey/adguardhomedotdoh:${{ github.ref_name }}-auto
