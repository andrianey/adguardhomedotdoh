name: Watch AdGuardHome Upstream
on:
  schedule:
    - cron: '0 */3 * * *'    # Every 3 hours for all branches
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    environment: docker-build 
    strategy:
      matrix:
        include:
          - type: "stable"
            branches: ["latest", "latest-wolfi"]
          - type: "edge"
            branches: ["hardened", "hardened-wolfi"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Get Latest Version and Compare
        id: version_check
        run: |
          # 1. Fetch Upstream Data (MATCHES YOUR GITLAB LOGIC)
          if [[ "${{ matrix.type }}" == "stable" ]]; then
            UPSTREAM=$(curl -s https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest | jq -r .tag_name)
          else
            echo "==> Pulling official edge image to inspect internal version..."
            docker pull adguard/adguardhome:edge > /dev/null
            
            # This is your EXACT GitLab logic adapted for GitHub Actions:
            UPSTREAM=$(docker run --rm --entrypoint=/opt/adguardhome/AdGuardHome adguard/adguardhome:edge --version 2>&1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | head -1)
          fi

          # 2. Extract CLEAN version from README.md using regex (not column position)
          BRANCH_NAME="${{ matrix.branches[0] }}"
          RAW_ROW=$(grep "| \`$BRANCH_NAME\` |" README.md)
          
          # Match the AdGuardHome version badge pattern: ![vX.Y.Z...](...)
          # This is robust to table column changes
          CURRENT=$(echo "$RAW_ROW" | grep -oP '\!\[v[0-9]+\.[0-9]+\.[0-9]+[^\]]*\]' | head -1 | sed 's/!\[//;s/\]//' | xargs)

          echo "Upstream (from Binary): $UPSTREAM"
          echo "README (from Table):   $CURRENT"

          # 3. Decision Logic
          if [[ -n "$UPSTREAM" ]] && [[ "$UPSTREAM" == "$CURRENT" ]]; then
            echo "✅ Exact match. Skipping build for $BRANCH_NAME."
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 Mismatch detected! Upstream ($UPSTREAM) != README ($CURRENT). Triggering GitLab..."
            echo "should_trigger=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger GitLab
        # Only run if a new version was found
        if: steps.version_check.outputs.should_trigger == 'true'
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
        run: |
          FAILED_BRANCHES=""
          for branch in ${{ join(matrix.branches, ' ') }}; do
            echo "==> Triggering GitLab branch: $branch"
            BODY=$(mktemp)
            RESPONSE=$(curl -s -o "$BODY" -w "%{http_code}" --request POST \
              --form token="$GITLAB_TRIGGER_TOKEN" \
              --form ref="$branch" \
              --form "variables[UPSTREAM_SYNC]=true" \
              "https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID/trigger/pipeline")
            
            if [ "$RESPONSE" = "201" ]; then
              echo "✅ Success: Pipeline created for $branch"
            else
              echo "❌ Failed: GitLab returned HTTP $RESPONSE"
              echo "Response body: $(cat "$BODY")"
              FAILED_BRANCHES="$FAILED_BRANCHES $branch"
            fi
            rm -f "$BODY"
          done
          
          if [ -n "$FAILED_BRANCHES" ]; then
            echo "❌ Failed to trigger branches:$FAILED_BRANCHES"
            exit 1
          fi
